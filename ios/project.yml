name: Squadz
options:
  bundleIdPrefix: com.zacelston.squadz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Pairing, pinned TLS, device key and sessions (the shared kit). No
  # published version yet: check it out next to this repository.
  PairKit:
    path: ../../pairkit

targets:
  Squadz:
    type: application
    platform: iOS
    sources:
      - path: Squadz
        excludes:
          - "Info.plist"
    dependencies:
      - package: PairKit
        product: PairKit
      - package: PairKit
        product: PairKitUI
    info:
      path: Squadz/Info.plist
      properties:
        CFBundleDisplayName: Squadz
        UILaunchScreen: {}
        # Invite links: squadz://pair?c=<base64url pairing code>.
        CFBundleURLTypes:
          - CFBundleURLName: com.zacelston.squadz.pair
            CFBundleURLSchemes:
              - squadz
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Squadz uses the camera to scan a pairing code."
        NSLocationWhenInUseUsageDescription: "Squadz shares your position with your squad while the app is open."
        NSLocalNetworkUsageDescription: "Squadz connects to your squad's server on the local network."
        # The server is a mesh node reached by IP address or .local name,
        # with a self-signed certificate. App Transport Security has no
        # per-domain exception for bare IP addresses, so local networking is
        # exempted as a whole. The app still only ever speaks TLS 1.3 to a
        # server whose key matches the pin from the pairing code (PairKit),
        # and that check fails closed. No arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - SquadzTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacelston.squadz
        DEVELOPMENT_TEAM: WZYFJ8TSWD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"

  SquadzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquadzTests
    dependencies:
      - target: Squadz
    settings:
      base:
        DEVELOPMENT_TEAM: WZYFJ8TSWD
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
